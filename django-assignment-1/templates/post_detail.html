{% extends 'base.html' %}

{% block content %}

<h1>{{ post.title }}</h1>

<p>
    Category: {{ post.category.name }}
</p>

<p>
    Author: {{ post.author.username }}
</p>

<p>
    {{ post.created_at }}
</p>

<hr>

<div>
    {{ post.content|linebreaks }}
</div>

<a href="/">Back to Home</a>

{% endblock %}
